<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V5 Brain — Live Screen</title><style>
*{box-sizing:border-box}body{margin:0;background:#172330;color:#fff;font:14px Arial,sans-serif}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px;background:#0f172a;border-bottom:1px solid #53657a}h1{font-size:15px;margin:0;margin-right:auto}label{display:flex;align-items:center;gap:6px}input[type=range]{width:130px;accent-color:#a78bfa}output{min-width:42px}button{background:#475569;color:white;border:1px solid #94a3b8;border-radius:5px;padding:5px 9px;cursor:pointer}#viewport{height:calc(100dvh - 100px);overflow:auto;display:grid;place-items:center;padding:12px}canvas{display:block;flex-shrink:0;background:#000;outline:5px solid #080d12;border-radius:4px;touch-action:none;cursor:crosshair}footer{padding:8px 12px;font-size:12px;color:#cbd5e1}#status{font-weight:bold;color:#86efac}</style></head><body><header><h1>V5 Brain · Live screen</h1><span id="status" role="status">Connecting…</span><label>Scale <input id="scale" aria-label="Screen scale" type="range" min="25" max="400" value="100" step="5"><output id="percent">100%</output></label><label><input id="fit" type="checkbox" checked>Fit window</label><button id="actual">100%</button></header><main id="viewport"><canvas width="480" height="240" tabindex="0" aria-label="Interactive V5 Brain touchscreen"></canvas></main><footer id="help">Touch the screen to interact. Resize this window or adjust Scale.</footer><script>
const screen=document.querySelector('canvas'),ctx=screen.getContext('2d'),slider=document.querySelector('#scale'),fit=document.querySelector('#fit'),percent=document.querySelector('#percent'),viewport=document.querySelector('#viewport'),status=document.querySelector('#status');
function api(){try{return window.opener&&!window.opener.closed?window.opener.brainScreenPopupAPI:null}catch{return null}}
function resize(){const scale=fit.checked?Math.max(.25,Math.min(4,(viewport.clientWidth-32)/480,(viewport.clientHeight-32)/240)):Number(slider.value)/100;screen.style.width=480*scale+'px';screen.style.height=240*scale+'px';percent.textContent=Math.round(scale*100)+'%';if(fit.checked)slider.value=Math.round(scale*100)}
slider.oninput=()=>{fit.checked=false;resize()};fit.onchange=resize;document.querySelector('#actual').onclick=()=>{fit.checked=false;slider.value=100;resize()};new ResizeObserver(resize).observe(viewport);
let released=true;
function send(e,down){const bridge=api();if(!bridge)return;const r=screen.getBoundingClientRect();bridge.touch(down,(e.clientX-r.left)*480/r.width,(e.clientY-r.top)*240/r.height);released=!down}
screen.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();screen.setPointerCapture(e.pointerId);send(e,true)};screen.onpointermove=e=>{if(!released)send(e,true)};screen.onpointerup=e=>send(e,false);screen.onpointercancel=screen.onlostpointercapture=()=>{if(!released){api()?.release();released=true}};window.addEventListener('pagehide',()=>api()?.release());window.addEventListener('blur',()=>{if(!released){api()?.release();released=true}});
function frame(){const bridge=api();if(bridge){ctx.drawImage(bridge.canvas,0,0);status.textContent=bridge.status();document.querySelector('#help').textContent='Touch the screen to interact. Resize this window or adjust Scale.'}else{status.textContent='Disconnected';document.querySelector('#help').textContent='Reopen this window from the simulator to reconnect.'}requestAnimationFrame(frame)}resize();requestAnimationFrame(frame);
</script></body></html>
